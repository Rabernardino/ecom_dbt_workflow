name: dbt Deploy Prod

on:
  push:
    branches:
      - main

jobs:
  dbt-cd:
    runs-on: ubuntu-latest
    
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar dependências do projeto (Raiz)
        run: poetry install --no-root

      - name: Instalar pacotes do dbt (dbt deps)
        working-directory: ./transform
        run: poetry run dbt deps

      - name: Executar dbt build em Produção
        working-directory: ./transform
        run: poetry run dbt build --target prod --profiles-dir .

      - name: Fazer upload do novo manifest.json para o Supabase
        working-directory: ./transform
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/dbt-artifacts/manifest.json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @target/manifest.json